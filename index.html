
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ROBOplan – iPad</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #24272c;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }

  /* iPad Gehäuse */
  .ipad {
    width: min(94vw, 1100px, calc(94dvh * 4 / 3));
    aspect-ratio: 4 / 3;
    padding: 14px;
    background: linear-gradient(
      135deg, #a5a7ab, #e3e4e6 35%,
      #74777d 75%, #c8c9cc
    );
    border-radius: 42px;
    box-shadow:
      0 25px 65px rgba(0,0,0,.55),
      inset 0 0 3px #fff;
  }

  /* Schwarzer Displayrahmen */
  .bezel {
    position: relative;
    width: 100%;
    height: 100%;
    background: #101114;
    border-radius: 31px;
    display: flex;
    align-items: center;
    padding: 14px 58px;
  }

  /* Bildschirm */
  .screen {
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 100%;
    border-radius: 5px;
    overflow: hidden;
    background: white;
    box-shadow: 0 0 0 2px #050505;
  }

  .screen iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
  }

  /* Frontkamera links */
  .camera {
    position: absolute;
    left: 25px;
    top: 50%;
    transform: translateY(-50%);
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(
      circle at 35% 35%,
      #305078, #080c18 65%, #000
    );
    border: 2px solid #22252a;
    box-shadow: 0 0 0 2px #090a0d;
  }

  /* Homebutton rechts */
  .home {
    position: absolute;
    right: 17px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid #303238;
    background: linear-gradient(
      145deg, #17181a, #08090b
    );
    box-shadow:
      inset 0 1px 3px #000,
      0 1px 1px #444;
    display: grid;
    place-items: center;
  }

  .home::after {
    content: "";
    width: 13px;
    height: 13px;
    border: 1.5px solid #55585e;
    border-radius: 3px;
  }
</style>
</head>

<body>

<div class="ipad">
  <div class="bezel">

    <div class="camera"></div>

    <div class="screen">
      <iframe src="app.html?v=20261102-task-overview7"
              title="iPad Website Vorschau">
      </iframe>
    </div>

    <div class="home"></div>

  </div>
</div>

</body>
</html>
