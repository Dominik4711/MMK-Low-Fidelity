<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROBOplan – iPad</title>
<style>

*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#535a50,#252b27 65%,#181c1a);font-family:Arial,sans-serif}
/* The tablet and the attached grip share one responsive hardware silhouette. */
.ipad{position:relative;width:min(96vw,1320px,calc(94dvh * 1.6));aspect-ratio:1.6;isolation:isolate;filter:drop-shadow(0 22px 22px #0008)}
.case-body{position:absolute;inset:0 15% 0 0;border:clamp(3px,.55vw,8px) solid #333631;border-radius:7% 7% 6% 6%;background:linear-gradient(145deg,#73746b 0%,#3c403a 14%,#55584e 30%,#2c302a 69%,#65685c 94%);box-shadow:inset 0 0 0 3px #8e91815c,inset 0 0 22px 7px #111b}
.case-body:before{content:'';position:absolute;inset:2.5% 2%;border:2px solid #85887a55;border-radius:5%;box-shadow:0 0 0 8px #20251f66,inset 0 0 8px #000}
.bezel{position:absolute;inset:5.2% 17.8% 5.2% 4.2%;padding:.8%;border-radius:3%;background:linear-gradient(130deg,#181d18,#080d09 70%,#262d22);box-shadow:0 0 0 3px #171b16,0 0 0 5px #92968155,inset 0 0 10px #000;z-index:6}
.screen{width:100%;height:100%;overflow:hidden;border-radius:1%;background:white;box-shadow:0 0 0 2px #000}
.screen iframe{display:block;width:100%;height:100%;border:0;background:white}
.case-brand{position:absolute;left:38%;top:.6%;width:23%;height:3.3%;display:grid;place-items:center;font-size:clamp(9px,1.35vw,18px);font-weight:800;letter-spacing:-.5px;color:#ecf2dd;text-shadow:0 2px 2px #000;background:linear-gradient(#34412c 0 40%,#8cab38 45%,#4f761e);clip-path:polygon(0 0,100% 0,90% 100%,10% 100%);border-top:3px solid #20281c;z-index:4}
.case-bottom-accent{position:absolute;bottom:1%;left:38%;width:23%;height:1.5%;background:linear-gradient(#b4cc4b,#60891e);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.bumper{position:absolute;width:13%;height:11%;background:linear-gradient(130deg,#686b62,#323831 45%,#191f19);border:2px solid #22271f;box-shadow:inset 0 3px 1px #a3a79555;z-index:3}
.bumper.tl{top:-1%;left:0;clip-path:polygon(15% 0,95% 0,100% 35%,78% 50%,45% 50%,35% 100%,0 100%,0 32%)}
.bumper.tr{top:-1%;right:-1%;transform:scaleX(-1);clip-path:polygon(15% 0,95% 0,100% 35%,78% 50%,45% 50%,35% 100%,0 100%,0 32%)}
.bumper.bl{bottom:-1%;left:0;transform:scaleY(-1);clip-path:polygon(15% 0,95% 0,100% 35%,78% 50%,45% 50%,35% 100%,0 100%,0 32%)}
.bumper.br{bottom:-1%;right:-1%;transform:scale(-1);clip-path:polygon(15% 0,95% 0,100% 35%,78% 50%,45% 50%,35% 100%,0 100%,0 32%)}
.screw{position:absolute;width:2%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#090c09 0 24%,#a5a795 27% 35%,#22291f 40% 60%,#6d7263 64% 70%,#20261e 73%);z-index:5;box-shadow:1px 2px 3px #000a}
.s1{left:18%;top:1.2%}.s2{right:16%;top:1.2%}.s3{left:18%;bottom:1.2%}.s4{right:16%;bottom:1.2%}
.camera{position:absolute;left:2.8%;top:37%;width:.7%;aspect-ratio:1;border:2px solid #262f24;border-radius:50%;background:radial-gradient(circle at 35% 35%,#577080,#101711 60%);z-index:5}
.side-ribs{position:absolute;left:.6%;top:23%;width:2.3%;height:14%;background:repeating-linear-gradient(0deg,#293122 0 15%,#8ba63b 18% 30%,#3c4f25 35% 45%);clip-path:polygon(0 0,100% 10%,100% 100%,0 90%);z-index:4}
.port{position:absolute;left:.6%;width:2.7%;height:18%;display:grid;place-items:center;color:#929987;font-size:clamp(10px,1.4vw,18px);background:linear-gradient(100deg,#60665a,#30382e 25%,#252d24 75%,#5d6655);border:2px solid #171f16;border-radius:18%;box-shadow:inset 0 0 0 3px #76816c33,2px 3px 2px #141b13;z-index:5}
.port-usb{top:42%}.port-power{top:66%}
/* A separate open hand grip, with a broad control head above the handle. */
.case-grip{position:absolute;right:-2%;top:11%;width:18%;height:79%;z-index:4;clip-path:inset(-20% -35% -20% -5%)}
.grip-bridge{position:absolute;left:-20%;top:0;width:75%;height:21%;border-radius:30%;transform:rotate(18deg);background:linear-gradient(0deg,#3d4a32,#a1bf42 37%,#627e2b 54%,#515c44 60%,#30392a);box-shadow:0 3px 4px #0009}
.grip-handle{position:absolute;right:3%;top:21%;bottom:0;width:48%;border-radius:35% 38% 40% 46%;transform:rotate(-7deg);background:radial-gradient(ellipse at 100% 50%,#4c5145,#272f25 60%,#151d15);border:2px solid #252d23;box-shadow:inset -6px 0 8px #747a6055,6px 8px 6px #0005}
.grip-handle:before{content:'';position:absolute;left:-14%;top:12%;height:77%;width:27%;border-radius:60%;background:linear-gradient(90deg,#627c27,#b0cc4b 50%,#486526);box-shadow:inset -3px 0 3px #25371b}
.grip-handle:after{content:'';position:absolute;inset:10% 10% 12% 22%;border-radius:40%;opacity:.28;background:repeating-radial-gradient(ellipse at 50% 50%,#10180f 0 1px,transparent 1px 4px)}
.grip-head{position:absolute;left:-5%;top:0;width:105%;height:38%;border-radius:47% 48% 42% 42%;transform:rotate(12deg);background:linear-gradient(140deg,#777e6b,#343d2e 28%,#222b20 70%,#5f6851);border:3px solid #222a1d;box-shadow:inset 0 0 0 5px #8f967b33,5px 8px 6px #0007}
.case-joystick{position:absolute;left:18%;top:4%;width:59%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#121a11 0 6%,#45513b 8% 11%,#131b11 13% 18%);border:3px solid #11190f;box-shadow:inset 0 0 0 3px #78826966,0 4px 5px #000;touch-action:none;cursor:grab;transform:rotate(-12deg)}
.case-joystick:focus-visible,.grip-button:focus-visible{outline:3px solid #c4e975;outline-offset:4px}
.joystick-stick{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(ellipse at 30% 25%,#777c6a,#414b36 55%,#1c2818 90%);border:3px solid #242f1d;box-shadow:3px 7px 3px #000b,inset 0 2px 2px #c9ccb344;pointer-events:none}
.joystick-stick:after{content:'';position:absolute;inset:8%;border-radius:50%;background:repeating-radial-gradient(circle,#92977d55 0 1px,transparent 1px 3px)}
.grip-button{position:absolute;bottom:9%;width:31%;height:22%;display:grid;place-items:center;border-radius:27%;border:2px solid #0b1208;background:linear-gradient(#58614a,#27331e);box-shadow:inset 0 1px 1px #abb19388,0 3px 1px #0b1208;color:#eff4df;font-size:clamp(12px,2vw,25px);cursor:pointer}
.grip-button:active{transform:translateY(2px);background:#76943c}.grip-start{left:13%}.grip-pause{left:50%}
.grip-wheel{position:absolute;right:4%;top:29%;height:30%;width:12%;border-radius:35%;background:repeating-linear-gradient(0deg,#171f12 0 3px,#7a8369 3px 5px);border:2px solid #1e2917;box-shadow:2px 1px 3px #000}
.case-emergency-stop{position:absolute;right:9%;top:.4%;width:7%;aspect-ratio:1;display:grid;place-items:center;padding:4px;border:3px solid #151b16;border-radius:50%;background:linear-gradient(145deg,#26312d,#0b100e);box-shadow:inset 0 0 0 1px #68756c66,0 2px 4px #0008;z-index:7;cursor:pointer;touch-action:manipulation}
.case-emergency-stop span{display:grid;place-items:center;align-self:stretch;justify-self:stretch;border-radius:50%;color:#fff;font-size:clamp(5px,.85vw,12px);font-weight:700;letter-spacing:.01em;background:linear-gradient(145deg,#dc3a39,#b91f26);box-shadow:inset 0 1px 1px #ffaaa555}
.case-emergency-stop:disabled{cursor:default}
.case-emergency-stop:disabled span{visibility:hidden}
.case-emergency-stop:not(:disabled):active span{background:#981a21}
.case-emergency-stop:focus-visible{outline:3px solid #fff4a5;outline-offset:4px}
@media(prefers-reduced-motion:no-preference){.joystick-stick{transition:transform .06s}}
</style>
</head>
<body>

<div class="ipad" aria-label="ROBOplan iPad mit robuster Schutzhülle und Joystick-Handgriff">
  <div class="case-body" aria-hidden="true"><div class="case-brand">ROBOplan</div><div class="case-bottom-accent"></div><i class="bumper tl"></i><i class="bumper tr"></i><i class="bumper bl"></i><i class="bumper br"></i><i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i></div>
  <div class="camera" aria-hidden="true"></div><div class="side-ribs" aria-hidden="true"></div><div class="port port-usb" aria-hidden="true">♧</div><div class="port port-power" aria-hidden="true">ϟ</div>
  <div class="bezel"><div class="screen"><iframe src="app.html?v=20261111-proposal-no-banner" title="ROBOplan iPad"></iframe></div></div>
  <button type="button" class="case-emergency-stop" aria-label="Touchdisplay · inaktiv" title="Touchdisplay · inaktiv" disabled onclick="releaseJoystick();sendCaseAction('stop')"><span></span></button>
  <div class="case-grip"><div class="grip-bridge" aria-hidden="true"></div><div class="grip-handle" aria-hidden="true"></div><div class="grip-head">
    <div class="case-joystick" role="slider" tabindex="0" aria-label="Joystick Fahrsteuerung" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" aria-valuetext="neutral"><div class="joystick-stick"></div></div>
    <button class="grip-button grip-start" aria-label="Taste 1" onclick="sendCaseAction('resume')">1</button><button class="grip-button grip-pause" aria-label="Taste 2" onclick="sendCaseAction('pause')">2</button><div class="grip-wheel" aria-hidden="true"></div>
  </div></div>
</div>
<script>
// Die Hülle ist fest; Touch-Scrollen findet ausschließlich in der separaten App statt.
document.addEventListener('touchmove',event=>{
  if(event.touches.length===1&&event.cancelable)event.preventDefault();
},{passive:false});
function sendCaseAction(action){document.querySelector('iframe').contentWindow.postMessage({type:'roboplan-case-action',action},location.origin==='null'?'*':location.origin);}
const caseTouchscreen=document.querySelector('.case-emergency-stop');
function updateCaseTouchscreen(manual){
  caseTouchscreen.disabled=!manual;
  caseTouchscreen.querySelector('span').textContent=manual?'Nothalt':'';
  const label=manual?'Nothalt für ausgewählten Roboter (Demo)':'Touchdisplay · inaktiv';
  caseTouchscreen.setAttribute('aria-label',label);caseTouchscreen.title=label;
}
window.addEventListener('message',event=>{
  if(event.source!==document.querySelector('iframe').contentWindow||event.origin!==location.origin||event.data?.type!=='roboplan-case-state')return;
  updateCaseTouchscreen(event.data.manual===true);
});
document.querySelector('iframe').addEventListener('load',()=>{
  updateCaseTouchscreen(false);
  document.querySelector('iframe').contentWindow.postMessage({type:'roboplan-case-state-request'},location.origin==='null'?'*':location.origin);
});
const joystick=document.querySelector('.case-joystick'),stick=joystick.querySelector('.joystick-stick');
function sendDirection(direction){document.querySelector('iframe').contentWindow.postMessage({type:'roboplan-joystick',direction},location.origin==='null'?'*':location.origin);joystick.setAttribute('aria-valuetext',direction);}
function releaseJoystick(){stick.style.transform='';joystick.setAttribute('aria-valuenow','0');sendDirection('neutral');}
joystick.addEventListener('pointerdown',event=>{joystick.setPointerCapture(event.pointerId);moveJoystick(event);});
function moveJoystick(event){if(!joystick.hasPointerCapture(event.pointerId))return;const box=joystick.getBoundingClientRect(),x=Math.max(-15,Math.min(15,event.clientX-box.left-box.width/2)),y=Math.max(-15,Math.min(15,event.clientY-box.top-box.height/2));stick.style.transform=`translate(${x}px,${y}px)`;joystick.setAttribute('aria-valuenow',String(Math.round(-y/15)));sendDirection(Math.abs(x)<4&&Math.abs(y)<4?'neutral':Math.abs(x)>Math.abs(y)?(x>0?'Rechts':'Links'):(y>0?'Rückwärts':'Vorwärts'));}
joystick.addEventListener('pointermove',moveJoystick);
['pointerup','pointercancel','lostpointercapture','blur'].forEach(name=>joystick.addEventListener(name,releaseJoystick));
joystick.addEventListener('keydown',event=>{const directions={ArrowUp:'Vorwärts',ArrowDown:'Rückwärts',ArrowLeft:'Links',ArrowRight:'Rechts'};if(directions[event.key]){event.preventDefault();sendDirection(directions[event.key]);}});
joystick.addEventListener('keyup',releaseJoystick);
</script>
</body>
</html>
