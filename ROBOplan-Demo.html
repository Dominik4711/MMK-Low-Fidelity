
<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ROBOplan – Offline-Demo</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #24272c;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }

  /* iPad Gehäuse */
  .ipad {
    width: min(94vw, 1100px, calc(94dvh * 4 / 3));
    aspect-ratio: 4 / 3;
    padding: 14px;
    background: linear-gradient(
      135deg, #a5a7ab, #e3e4e6 35%,
      #74777d 75%, #c8c9cc
    );
    border-radius: 42px;
    box-shadow:
      0 25px 65px rgba(0,0,0,.55),
      inset 0 0 3px #fff;
  }

  /* Schwarzer Displayrahmen */
  .bezel {
    position: relative;
    width: 100%;
    height: 100%;
    background: #101114;
    border-radius: 31px;
    display: flex;
    align-items: center;
    padding: 14px 58px;
  }

  /* Bildschirm */
  .screen {
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 100%;
    border-radius: 5px;
    overflow: hidden;
    background: white;
    box-shadow: 0 0 0 2px #050505;
  }

  .screen iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
  }

  /* Frontkamera links */
  .camera {
    position: absolute;
    left: 25px;
    top: 50%;
    transform: translateY(-50%);
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(
      circle at 35% 35%,
      #305078, #080c18 65%, #000
    );
    border: 2px solid #22252a;
    box-shadow: 0 0 0 2px #090a0d;
  }

  /* Homebutton rechts */
  .home {
    position: absolute;
    right: 17px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid #303238;
    background: linear-gradient(
      145deg, #17181a, #08090b
    );
    box-shadow:
      inset 0 1px 3px #000,
      0 1px 1px #444;
    display: grid;
    place-items: center;
  }

  .home::after {
    content: "";
    width: 13px;
    height: 13px;
    border: 1.5px solid #55585e;
    border-radius: 3px;
  }
</style>
</head>

    &lt;style&gt;
:root {
  --ink:#203b38;
  --muted:#7c8987;
  --green:#29765e;
  --line:#e5ebe8;
  --bg:#f4f7f6
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif
}
button,a {
  -webkit-tap-highlight-color:transparent
}
button {
  font:inherit;
  cursor:pointer
}
button:focus-visible,a:focus-visible {
  outline:3px solid #51a789;
  outline-offset:4px
}
header {
  height:88px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 36px;
  border-bottom:1px solid var(--line);
  gap:50px
}
.brand {
  font-size:26px;
  font-weight:750;
  letter-spacing:-1.5px;
  display:flex;
  gap:10px;
  align-items:center
}
.logo {
  display:grid;
  place-items:center;
  background:var(--green);
  width:35px;
  height:35px;
  border-radius:12px;
  color:white;
  font-size:24px
}
nav {
  display:flex;
  gap:9px;
  height:100%;
  align-items:center
}
nav a {
  padding:13px 20px;
  text-decoration:none;
  color:#71817d;
  border-radius:10px;
  font-weight:600;
  display:flex;
  gap:10px;
  align-items:center
}
nav a.active {
  background:var(--green);
  color:#fff
}
.headright {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:18px
}
.connection {
  font-size:12px;
  color:#5c7770
}
.voice-assistant {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-shrink:0;
  width:auto;
  height:44px;
  padding:9px 13px;
  white-space:nowrap;
  font-size:12px;
  font-weight:600;
  border:1px solid var(--green);
  border-radius:9px;
  background:var(--green);
  color:#fff
}
.dot {
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:100%;
  background:#409770;
  margin-right:6px
}
.avatar {
  background:#edf1ec;
  border:1px solid #dce5df;
  border-radius:50%;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:700
}
main {
  max-width:1560px;
  margin:auto;
  padding:32px 36px
}
.intro {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:26px
}
h1 {
  font-size:28px;
  letter-spacing:-.8px;
  margin:0 0 8px
}
.sub {
  color:var(--muted);
  margin:0;
  font-size:13px
}
.day {
  text-align:right;
  font-size:13px;
  line-height:1.8
}
.layout {
  display:grid;
  grid-template-columns:minmax(265px,.82fr) minmax(0,1.8fr);
  gap:24px
}
.left {
  display:flex;
  flex-direction:column;
  gap:22px
}
.panel,.robot {
  background:white;
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden
}
.panelhead {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:19px 20px
}
h2 {
  font-size:15px;
  margin:0
}
.tiny {
  font-size:11px;
  color:var(--muted)
}
.map {
  position:relative;
  overflow:hidden;
  background:#dce4d4;
  isolation:isolate
}
.map svg.land {
  width:100%;
  height:100%;
  position:absolute;
  inset:0
}
.overview {
  height:300px;
  margin:0 8px 8px;
  border-radius:11px
}
.maplabel {
  position:absolute;
  left:16px;
  bottom:16px;
  background:#fffdf7ed;
  border:1px solid #fff;
  border-radius:7px;
  padding:8px 10px;
  font-size:10px;
  letter-spacing:.4px;
  color:#5c6c60
}
.maptools {
  position:absolute;
  bottom:13px;
  right:12px;
  display:flex;
  gap:5px
}
.maptools button {
  width:31px;
  height:31px;
  border:1px solid #dfe6dc;
  background:white;
  border-radius:7px;
  color:var(--ink);
  font-size:19px
}
.pin {
  position:absolute;
  background:var(--pin,#29765e);
  color:white;
  border:3px solid white;
  border-radius:50%;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  box-shadow:0 0 0 12px color-mix(in srgb,var(--pin,#29765e) 15%,transparent),0 3px 8px #28423430;
  font-size:12px;
  font-weight:700;
  z-index:2
}
.pin.selected {
  box-shadow:0 0 0 18px #29765e30,0 3px 8px #28423430
}
.weather {
  padding:20px
}
.weather-top {
  display:flex;
  justify-content:space-between;
  align-items:center
}
.weather-main {
  display:flex;
  align-items:center;
  gap:18px;
  margin:22px 0
}
.sun {
  color:#e9b746;
  font-size:58px;
  line-height:1
}
.temp {
  font-size:36px;
  font-weight:600;
  letter-spacing:-1px
}
.temp small {
  font-size:21px
}
.weather-main p {
  margin:3px 0;
  color:var(--muted);
  font-size:12px
}
.weather-row {
  display:flex;
  justify-content:space-between;
  border-top:1px solid #edf1ee;
  padding:12px 0;
  font-size:12px
}
.weather-row:last-child {
  padding-bottom:0
}
.weather-row span {
  color:#7e8d88
}
.fleetbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 0 15px
}
.fleetbar h2 {
  font-size:16px
}
.live {
  color:var(--green);
  font-size:12px;
  background:#eaf2ec;
  border-radius:20px;
  padding:7px 10px
}
.robots {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px
}
.robot {
  padding:20px;
  transition:box-shadow .2s,transform .2s
}
.robot:hover {
  box-shadow:0 7px 25px #284e3d0b;
  transform:translateY(-2px)
}
.robothead {
  display:flex;
  justify-content:space-between;
  align-items:center
}
.robotname {
  display:flex;
  gap:10px;
  align-items:center
}
.roboticon {
  background:#f1f5f1;
  border-radius:9px;
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  color:var(--green)
}
.robot h3 {
  font-size:16px;
  margin:0 0 4px;
  letter-spacing:-.2px
}
.robotid {
  font-size:10px;
  color:var(--muted);
  letter-spacing:.7px
}
.battery {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:#6d7c75
}
.battery i {
  height:11px;
  width:21px;
  border:1px solid #85978b;
  border-radius:3px;
  padding:2px;
  position:relative
}
.battery i:after {
  content:&#x27;&#x27;;
  position:absolute;
  width:2px;
  height:5px;
  background:#85978b;
  right:-3px;
  top:2px
}
.battery b {
  display:block;
  height:100%;
  background:#76a681;
  width:var(--b)
}
.statusline {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:17px
}
.badge {
  font-size:10px;
  color:var(--green);
  background:#eef5ef;
  padding:5px 8px;
  border-radius:5px
}
.area {
  font-size:11px;
  color:var(--muted)
}
.metrics {
  display:flex;
  align-items:center;
  gap:21px;
  margin:17px 0
}
.ring {
  width:77px;
  height:77px;
  border-radius:50%;
  background:conic-gradient(var(--green) calc(var(--p)*1%),#eaf0ec 0);
  display:grid;
  place-items:center;
  position:relative
}
.ring:before {
  content:&#x27;&#x27;;
  position:absolute;
  inset:6px;
  background:white;
  border-radius:50%
}
.ring strong {
  position:relative;
  font-size:20px;
  letter-spacing:-.6px
}
.ring strong small {
  font-size:11px
}
.remaining {
  border-left:1px solid var(--line);
  padding-left:20px
}
.remaining span {
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px
}
.remaining strong {
  display:block;
  font-size:19px;
  letter-spacing:-.4px
}
.remaining small {
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:5px
}
.mini {
  height:108px;
  border-radius:9px;
  width:100%;
  border:0;
  display:block;
  text-align:left
}
.mini .pin {
  top:38%;
  left:50%;
  width:29px;
  height:29px;
  font-size:10px
}
.mini .maplabel {
  bottom:9px;
  left:10px;
  padding:5px 7px;
  font-size:9px
}
.robotfoot {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:13px;
  font-size:10px;
  color:var(--muted)
}
.detail {
  background:none;
  border:0;
  color:var(--green);
  font-size:11px;
  font-weight:600;
  padding:6px 0 6px 10px
}
.footer {
  display:flex;
  justify-content:space-between;
  margin-top:24px;
  color:#8b9791;
  font-size:10px
}
.demo {
  padding:4px 6px;
  border:1px solid #dfe6df;
  border-radius:4px;
  letter-spacing:.5px
}
.placeholder {
  padding:65px 30px;
  background:white;
  border:1px solid var(--line);
  border-radius:16px
}
.placeholder h2 {
  font-size:25px;
  margin:12px 0
}
.placeholder p {
  color:var(--muted)
}
.primary {
  background:var(--green);
  border:0;
  border-radius:9px;
  padding:13px 18px;
  color:white;
  margin-top:15px
}
dialog {
  border:1px solid var(--line);
  border-radius:20px;
  max-width:440px;
  width:calc(100% - 32px);
  padding:28px;
  color:var(--ink);
  box-shadow:0 20px 80px #102a3430
}
dialog::backdrop {
  background:#173d3655;
  backdrop-filter:blur(3px)
}
dialog h2 {
  font-size:23px;
  margin:10px 0
}
dialog p {
  line-height:1.7;
  color:#71817b
}
.dialogrow {
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid var(--line)
}
.close {
  float:right;
  border:0;
  background:#f0f4f0;
  border-radius:50%;
  width:32px;
  height:32px;
  font-size:20px
}
.notice {
  font-size:11px!important
}
[hidden] {
  display:none!important
}
@media(min-width:1400px) {
  .overview {
    height:340px
  }
  .mini {
    height:139px
  }
  .robot {
    padding:23px
  }
  .weather {
    padding:24px
  }
}
@media(max-width:1050px) {
  header {
    padding:0 24px;
    gap:24px
  }
  .connection {
    display:none
  }
  main {
    padding:25px 24px
  }
  .layout {
    gap:18px;
    grid-template-columns:minmax(240px,.8fr) minmax(0,1.8fr)
  }
  .robot {
    padding:15px
  }
  .robots {
    gap:15px
  }
  .metrics {
    gap:13px
  }
  .remaining {
    padding-left:13px
  }
  .remaining strong {
    font-size:17px
  }
  .area {
    font-size:10px
  }
  .ring {
    width:66px;
    height:66px
  }
  .overview {
    height:280px
  }
}
@media(max-width:760px) {
  header {
    height:auto;
    min-height:76px;
    flex-wrap:wrap;
    padding:17px 18px;
    gap:16px
  }
  .headright {
    position:absolute;
    right:18px;
    top:18px
  }
  nav {
    order:3;
    width:100%;
    gap:5px
  }
  nav a {
    flex:1;
    justify-content:center;
    padding:12px 6px;
    font-size:12px
  }
  .brand {
    font-size:24px
  }
  main {
    padding:24px 16px
  }
  .intro {
    align-items:flex-start
  }
  .day {
    font-size:11px
  }
  .layout {
    grid-template-columns:1fr
  }
  .left {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px
  }
  .overview {
    height:245px
  }
  .weather {
    padding:16px
  }
  .weather-row {
    font-size:10px;
    padding:10px 0
  }
  .weather-main {
    margin:15px 0;
    gap:9px
  }
  .temp {
    font-size:30px
  }
  .sun {
    font-size:42px
  }
  .weather-top .tiny {
    display:none
  }
  .panelhead {
    padding:16px
  }
  .fleetbar {
    margin-top:8px
  }
  .robots {
    gap:14px
  }
  .robothead {
    align-items:flex-start
  }
  .battery {
    font-size:10px
  }
  .roboticon {
    display:none
  }
  .statusline {
    gap:5px

  .metrics {
    gap:10px
  }
  .ring {

    height:60px
  }
  .remaining {
    padding-left:10px
  }
  .remaining strong {
    font-size:15px
  }
  .robot {
    padding:14px

  .mini {
    height:100px

  .area {
    max-width:68px;
    text-align:right
  }

    gap:12px
  }

@media(max-width:380px) {
  .robots,.left {
    grid-template-columns:1fr
  }
  .day {
    display:none
  }
  .overview {
    height:230px
  }
}

html,body {
  width:100%;
  height:100%;
  overflow:hidden
}
body {
  display:flex;
  flex-direction:column
}
body&gt;header {
  flex:0 0 88px;
  position:relative;
  z-index:5
}
body&gt;main {
  width:100%;

  flex-direction:column;

  flex:1;

  grid-template-columns:minmax(0,1fr);

  padding:14px!important

  height:92px!important
}
.metrics {
  margin:10px 0
}
.statusline {
  margin-top:10px
}
.robotfoot {
  margin-top:8px
}
.footer {
  flex:0 0 auto;
  margin-top:9px;
  padding-bottom:2px
}
#other:not([hidden]) {
  overflow-y:auto;
  min-height:0
}

#fields {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:16px
}
.field-heading {
  display:flex;
  align-items:center;
  justify-content:space-between
}
.field-layout {
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(260px,1fr);
  gap:20px
}
.field-map {
  min-height:0;
  border:1px solid var(--line);
  border-radius:17px;
  background:#e4ebdc;
  overflow:hidden;
  position:relative
}
.field-map svg {
  display:block;
  width:100%;
  height:100%
}
.field-shape {
  cursor:pointer;
  stroke:#fff;
  stroke-width:4;
  transition:fill .2s
}
.field-shape.selected {
  stroke:#29765e;
  stroke-width:5
}
.field-shape:focus-visible {
  outline:none;
  stroke:#203b38;
  stroke-width:7
}
.field-list {
  overflow-y:auto;
  min-height:0;
  padding:0 5px 5px 0;
  display:flex;
  flex-direction:column;
  gap:12px
}
.field-card {
  flex-shrink:0;
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px
}
.field-card.selected {
  border-color:var(--green);
  box-shadow:inset 3px 0 var(--green)
}
.field-card-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px
}
.field-select {
  border:0;
  background:none;
  color:var(--ink);
  font-size:17px;
  font-weight:650;
  padding:0
}
.field-info {
  border:1px solid var(--line);
  background:#f1f6f2;
  color:var(--green);
  border-radius:8px;
  padding:7px 12px
}
.field-card p {
  margin:10px 0;
  color:var(--muted);
  font-size:12px
}
.field-card strong {
  color:var(--ink)
}
.field-robots {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:14px
}
.field-robots span {
  background:#eaf3ee;
  color:var(--green);
  padding:6px 9px;
  border-radius:6px;
  font-size:11px
}
.field-legend {
  position:absolute;
  bottom:14px;
  left:14px;
  background:#ffffffed;
  padding:10px 13px;
  border-radius:8px;
  font-size:11px;
  color:var(--muted)
}
@media(max-width:760px) {
  .field-layout {
    grid-template-columns:minmax(0,1.5fr) minmax(200px,1fr);
    gap:10px
  }
  .field-card {
    padding:13px
  }
  .field-heading h1 {
    font-size:21px
  }
  header nav a {
    gap:2px
  }
  .brand {
    letter-spacing:-1px

  header {
    gap:16px

  nav a {
    padding-left:10px;

    flex-basis:auto

    font-size:9px

  gap:28px
