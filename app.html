<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7f8">
    <title>
      ROBOplan
    </title>
    <link rel="stylesheet" href="styles.css?v=20261111-proposal-no-banner">
    <script src="bootstrap.js?v=20261111-proposal-no-banner" defer>
    </script>
  </head>
  <body>
    <header>
      <div class="user-account-menu" id="user-account-menu">
        <button id="user-menu-trigger" class="user-menu-trigger" type="button" aria-label="Benutzermenü öffnen" title="Benutzermenü" aria-haspopup="menu" aria-expanded="false" aria-controls="user-dropdown" onclick="toggleUserMenu()"><span data-user-initials>HA</span></button>
        <div id="user-dropdown" class="user-dropdown" role="menu" aria-label="Benutzerkonto" hidden>
          <div class="user-dropdown-identity" role="presentation"><strong data-user-name>Hans Admin</strong><span data-user-role>Admin</span></div>
          <a href="#konto-profil" role="menuitem" onclick="closeUserMenu()">Profil</a>
          <a href="#konto-einstellungen" role="menuitem" onclick="closeUserMenu()">Einstellungen</a>
          <a href="#konto-logout" role="menuitem" class="user-dropdown-logout" onclick="closeUserMenu()">Logout</a>
        </div>
      </div>
      <nav aria-label="Hauptnavigation">
        <a href="#home" data-page="home" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>
            </path>
          </svg>
          <span>
            Übersicht
          </span>
        </a>
        <a href="#ackerschlagskarte" data-page="ackerschlagskarte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z M9 3v16M15 5v16"/>
            </path>
          </svg>
          <span>
            Ackerschläge
          </span>
        </a>
        <a href="#roboterverwaltung" data-page="roboterverwaltung">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="9" width="14" height="10" rx="3"/>
            </rect>
            <path d="M12 9V5M9 3a5 5 0 0 0 0 4m6-4a5 5 0 0 1 0 4M3 13v5m18-5v5M9 13h6"/>
            </path>
          </svg>
          <span>
            Flottenmanagement
          </span>
        </a>
        <a href="#auftragsverwaltung" data-page="auftragsverwaltung">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="16" height="17" rx="2"/>
            </rect>
            <path d="M9 3h6v4H9ZM8 12l2 2 5-4M8 18h8"/>
            </path>
          </svg>
          <span>
            Disposition
          </span>
        </a>
      </nav>
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 40 40" width="35" height="35" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Feldroboter mit Funkwellen">
            <path d="M6 34h28M11 37h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".4"/>
            </path>
            <rect x="7" y="22" width="6" height="10" rx="2" fill="currentColor"/>
            </rect>
            <rect x="27" y="22" width="6" height="10" rx="2" fill="currentColor"/>
            </rect>
            <path d="M13 18h14l3 10H10l3-10Z" fill="currentColor"/>
            </path>
            <path d="M16 21h8" stroke="#29765e" stroke-width="2" stroke-linecap="round"/>
            </path>
            <path d="M20 18v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </path>
            <circle cx="20" cy="11" r="2" fill="currentColor"/>
            </circle>
            <path d="M14.5 6a7.5 7.5 0 0 0 0 10M25.5 6a7.5 7.5 0 0 1 0 10M10.5 3a12 12 0 0 0 0 16M29.5 3a12 12 0 0 1 0 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </path>
          </svg>
        </span>
        ROBOplan
      </div>
      <div class="headright">
        <div id="header-alerts" class="header-alerts" role="group" aria-label="Roboterstatus: Fehler, Warnungen und OK"></div>
        <div class="header-clock"><time id="header-time"></time><span id="header-date"></span></div>
        <span class="connection">
          <i class="dot">
          </i>
          System verbunden
        </span>
        <button type="button" id="voice-assistant" class="voice-assistant" aria-pressed="false" aria-label="KI-Assistent: Demo-Aufnahme starten" title="Demo-Aufnahme starten" onclick="toggleVoiceAssistant()">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>
          </svg>
          <span class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="voice-copy"><span id="voice-label">KI-Assistent</span><small id="voice-listening" hidden>Demo · hört zu …</small></span>
        </button>
      </div>
    </header>
    <span id="voice-status" class="voice-status" role="status"></span>
    <main id="page-content" aria-busy="true">
    </main>
    <dialog id="details">
      <button class="close" aria-label="Schließen" onclick="this.closest('dialog').close()">
        ×
      </button>
      <span class="tiny">
        DETAILS
      </span>
      <h2 id="detailTitle">
      </h2>
      <p id="detailArea">
      </p>
      <div id="detailRows">
      </div>
      <button class="primary" onclick="document.getElementById('details').close()">
        Zurück zur Übersicht
      </button>
    </dialog>
  </body>
</html>
