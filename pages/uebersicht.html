<!-- Inhalt der Unterseite; eingebunden durch app.html. -->
<section id="home">
  <div class="layout">
    <aside class="left">
      <section class="panel">
        <div class="panelhead">
          <h2>
            Einsatzgebiet
          </h2>
          <span class="tiny">
            3 Roboter im Einsatz · 1 Störung · 2 auf dem Hof
          </span>
        </div>
        <div class="map overview" id="overview">
          <span class="maplabel">
            HOF GRÜNPARK · 8 FELDER
          </span>
          <div class="maptools">
            <button aria-label="Karte vergrößern" id="zoomIn">
              +
            </button>
            <button aria-label="Karte verkleinern" id="zoomOut">
              −
            </button>
          </div>
        </div>
      </section>
      <section class="panel weather weather-link" role="link" tabindex="0" aria-label="Wetterseite öffnen" onclick="openOverviewWeather()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openOverviewWeather()}">
        <div class="weather-top">
          <h2 id="overview-weather-title">
            Wetter am aktuellen Standort
          </h2>
          <span class="tiny" id="overview-weather-location">
            Grünpark
          </span>
        </div>
        <div class="weather-main">
          <span class="sun">
            ☀
          </span>
          <div>
            <div class="temp">
              18
              <small>
                °C
              </small>
            </div>
            <p>
              Sonnig, beste Bedingungen
            </p>
          </div>
        </div>
        <div class="weather-row">
          <span>
            ♧
            &nbsp;
            Niederschlag
          </span>
          <strong>
            2,4 mm
          </strong>
        </div>
        <div class="weather-row">
          <span>
            ☂
            &nbsp;
            Regenwahrscheinlichkeit
          </span>
          <strong>
            15 %
          </strong>
        </div>
        <div class="weather-row">
          <span>
            ≋
            &nbsp;
            Wind aus NW
          </span>
          <strong>
            12 km/h
          </strong>
        </div>
        <div class="weather-row">
          <span>
            ♧
            &nbsp;
            Gefühlte Temperatur
          </span>
          <strong>
            17 °C
          </strong>
        </div>
      </section>
    </aside>
    <section>
      <div class="fleetbar">
        <h2>
          Deine Roboter
          <span style="color:#95a29b;font-weight:400;margin-left:5px">
            06
          </span>
        </h2>
        <button type="button" id="overview-plan-suggest" class="overview-plan-suggest" data-plan-suggestion onclick="toggleDispatchSuggestion(true)">✧ KI-Vorschlag</button>
        <div id="overview-alerts" class="fleet-alert-summary" role="group" aria-label="Roboter nach Meldungen filtern"></div>
      </div>
      <div class="robots" id="robots" tabindex="0" role="region" aria-label="Roboterliste">
      </div>
    </section>
  </div>
</section>
